[workspace]
resolver = "2"
members = [
    "crates/birdman-auth",
    "crates/birdman-backend",
    "crates/birdman-cli",
    "crates/birdman-client",
    "crates/birdman-daemon",
    "crates/birdman-config",
    "crates/birdman-proto",
    "crates/birdman-service",
    "crates/birdman-store",
    "crates/birdman-mime",
    "crates/connectors/birdman-imap",
    "crates/connectors/birdman-smtp",
    "crates/birdman-ui",
]
exclude = ["vendor/block-0.1.6", "vendor/imap-proto-0.16.7", "vendor/gpui-0.2.2"]

# gpui 0.2.2 still reaches the abandoned `block` 0.1.6 crate through its
# macOS stack. Rust 1.96 warns that its uninhabited extern-static type will
# become a hard error. Keep the small, MIT-licensed compatibility patch local
# until gpui migrates to block2; see vendor/block-0.1.6/BIRDMAN-PATCH.md.
[patch.crates-io]
block = { path = "vendor/block-0.1.6" }
# GreenMail emits a partial BODY response accepted by other IMAP clients but
# rejected by imap-proto 0.16.7; see vendor/imap-proto-0.16.7/BIRDMAN-PATCH.md.
imap-proto = { path = "vendor/imap-proto-0.16.7" }
# `X11Window`'s `HasWindowHandle`/`HasDisplayHandle` are `unimplemented!()` in
# the published 0.2.2, which panics the instant the reading pane's webview
# tries to attach under XWayland. Already fixed on gpui's `main`; see
# vendor/gpui-0.2.2/BIRDMAN-PATCH.md.
gpui = { path = "vendor/gpui-0.2.2" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Third-party dependencies are optimized even in debug builds; our own
# workspace crates stay at opt-level 0 for fast incremental rebuilds.
[profile.dev.package."*"]
opt-level = 3
# No debug info for dependencies. It is the single largest thing on disk here:
# `libgpui.rlib` is 150MB with it and a fraction of that without, and there are
# several generations of it at a time. `target/` had reached 32GB, 22GB of that
# dependency rlibs.
#
# The cost is that a backtrace through gpui or wry gives function names but no
# line numbers. Nobody has ever wanted those -- when a crash points into a
# dependency the useful frame is always our own, and our crates keep full debug
# info because this only applies to `*`.
debug = false
