[package]
name = "birdman-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "birdmand"
path = "src/main.rs"

[dependencies]
birdman-config = { path = "../birdman-config" }
birdman-proto = { path = "../birdman-proto" }
birdman-service = { path = "../birdman-service" }
birdman-store = { path = "../birdman-store" }
birdman-backend = { path = "../birdman-backend" }
birdman-auth = { path = "../birdman-auth" }
birdman-imap = { path = "../connectors/birdman-imap" }
birdman-smtp = { path = "../connectors/birdman-smtp" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serde_json = "1"
chrono = "0.4"
log = "0.4"
async-channel = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
