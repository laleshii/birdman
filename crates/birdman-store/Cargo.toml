[package]
name = "birdman-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
birdman-mime = { path = "../birdman-mime" }
sha2 = "0.10"
libc = "0.2"
log = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
rusqlite_migration = "2.6.0"

[dev-dependencies]
tempfile = "3"
